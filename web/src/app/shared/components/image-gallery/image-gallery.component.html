<div class="gallery-grid">
  @for (src of images; track src; let i = $index) {
    <img class="gallery-thumbnail" [src]="src" [alt]="alt" (click)="open(i)" />
  }
</div>

<dialog #dialog class="gallery-dialog" [attr.aria-label]="alt" (close)="onClosed()" (click)="onDialogClick($event)" (keydown)="onKeydown($event)">
  @if (activeIndex() !== null) {
    <div class="gallery-close-container">
      <button type="button" class="gallery-close" aria-label="Close" (click)="close()">&times;</button>
      <span class="gallery-esc-hint">Esc</span>
    </div>
    <div class="gallery-modal-columns">
      <div class="gallery-thumbnails">
        @for (src of images; track src; let i = $index) {
          <img class="gallery-modal-thumbnail" [class.active]="i === activeIndex()" [src]="src" [alt]="alt" (click)="select(i)" />
        }
      </div>
      <div class="gallery-main-image">
        <img [src]="images[activeIndex()!]" [alt]="alt" />
      </div>
    </div>
  }
</dialog>

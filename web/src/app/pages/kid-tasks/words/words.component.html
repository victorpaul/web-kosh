<app-worksheet-layout titleKey="wp.title" taglineKey="wp.tagline" [stacked]="true">
  <ng-container ngProjectAs="[rail]">
    <app-rail-group titleKey="wp.count">
      <app-number-stepper [label]="'wp.count' | t" [value]="state.count" [min]="limits.minWords" [max]="limits.maxWords" (valueChange)="setCount($event)" />
    </app-rail-group>

    <app-rail-group titleKey="wp.length" hintKey="wp.lengthHint" [hintParams]="{ n: available() }">
      <div class="row2">
        <app-number-stepper captionKey="m.min" [value]="state.minLength" [min]="limits.minLength" [max]="limits.maxLength" (valueChange)="setMinLength($event)" />
        <app-number-stepper captionKey="m.max" [value]="state.maxLength" [min]="limits.minLength" [max]="limits.maxLength" (valueChange)="setMaxLength($event)" />
      </div>
      @if (available() < state.count) {
        <p class="hint warn">{{ 'wp.fewWords' | t: { n: available(), want: state.count } }}</p>
      }
    </app-rail-group>

    <app-rail-group titleKey="wp.sets">
      <app-toggle-group [options]="setOptions()" [selected]="state.sets" minMessageKey="wp.minSets" (selectedChange)="setSets($event)" />
      <app-check-option labelKey="wp.caps" [checked]="state.caps" (checkedChange)="setCaps($event)" />
    </app-rail-group>

    <app-rail-group titleKey="m.sheet">
      <app-number-stepper captionKey="a.sheets" [value]="state.sheets" [min]="1" [max]="4" (valueChange)="setSheets($event)" />
      <app-check-option labelKey="c.doneBox" [checked]="state.done" (checkedChange)="setDone($event)" />
    </app-rail-group>

    <app-sheet-actions [name]="state.name" [showGenerate]="true" hintKey="wp.printerHint" (generate)="regenerate()" (nameChange)="setName($event)" (save)="save()" />

    <app-rail-group titleKey="m.saved">
      <app-saved-list [store]="store" [nameOf]="nameOf" (opened)="open($event)" />
    </app-rail-group>
  </ng-container>

  @for (page of state.pages; track $index) {
    <app-page-sheet [how]="'wp.how' | t" [done]="state.done">
        <app-match-block [rows]="page.words.length" leftWidth="72mm" rightWidth="34mm" [left]="wordCell" [right]="picCell" />
        <ng-template #wordCell let-i><span class="word" [class.caps]="state.caps">{{ word(page.words[i]) }}</span></ng-template>
        <ng-template #picCell let-i><span class="pic">{{ pic(page.words[page.right[i]]) }}</span></ng-template>
    </app-page-sheet>
  }
</app-worksheet-layout>

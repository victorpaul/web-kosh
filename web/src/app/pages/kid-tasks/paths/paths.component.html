<app-worksheet-layout titleKey="a.title" taglineKey="a.tagline" [stacked]="true">
  <ng-container ngProjectAs="[rail]">
    <app-rail-group titleKey="a.steps" hintKey="a.stepsHint" [hintParams]="{ min: minSteps, max: maxSteps }">
      <app-number-stepper [label]="'a.steps' | t" [value]="state.steps" [min]="minSteps" [max]="maxSteps" (valueChange)="setSteps($event)" />
    </app-rail-group>

    <app-rail-group titleKey="a.obstacles" hintKey="a.obstaclesHint" [hintParams]="{ max: maxObstacles }">
      <app-number-stepper [label]="'a.obstacles' | t" [value]="state.obstacles" [min]="0" [max]="maxObstacles" (valueChange)="setObstacles($event)" />
    </app-rail-group>

    <app-rail-group titleKey="a.enemies" hintKey="a.enemiesHint" [hintParams]="{ max: maxEnemies }">
      <app-number-stepper [label]="'a.enemies' | t" [value]="state.enemies" [min]="0" [max]="maxEnemies" (valueChange)="setEnemies($event)" />
    </app-rail-group>

    <app-rail-group titleKey="a.items" hintKey="a.itemsHint" [hintParams]="{ max: maxItems }">
      <app-number-stepper [label]="'a.items' | t" [value]="state.items" [min]="0" [max]="maxItems" (valueChange)="setItems($event)" />
    </app-rail-group>

    <app-rail-group titleKey="m.sheet">
      <app-number-stepper captionKey="a.sheets" [value]="state.count" [min]="1" [max]="4" (valueChange)="setCount($event)" />
      <app-check-option labelKey="c.doneBox" [checked]="state.done" (checkedChange)="setDone($event)" />
    </app-rail-group>

    <app-sheet-actions [name]="state.name" [showGenerate]="true" hintKey="a.printerHint" (generate)="regenerate()" (nameChange)="setName($event)" (save)="save()" />

    <app-rail-group titleKey="m.saved">
      <app-saved-list [store]="store" [nameOf]="nameOf" (opened)="open($event)" />
    </app-rail-group>
  </ng-container>

  @for (p of state.puzzles; track $index) {
    <app-page-sheet [how]="'a.how' | t" [note]="note(p)" [done]="state.done">
      <div class="puzzle">
        <ol class="steps">
          @for (step of p.steps; track $index) {
            <li>
              <span class="n">{{ step.len }}</span>
              <svg class="arrow" viewBox="-10 -10 20 20" aria-hidden="true">
                <g [attr.transform]="rotate(step.dir)">
                  <path d="M-7 0H6M1-5l5 5-5 5" />
                </g>
              </svg>
            </li>
          }
        </ol>

        @let scene = sceneOf(p);
        <div class="board">
          <svg class="grid" [attr.viewBox]="scene.viewBox" [style.width.mm]="sizeMm()" [style.height.mm]="sizeMm()">
            <!-- tiles overlap a hair so no seams show; the group's opacity keeps the overlaps invisible -->
            <g class="field">
              @for (tile of scene.grass; track $index) {
                <svg [attr.x]="tile.x" [attr.y]="tile.y" width="1.02" height="1.02" [attr.viewBox]="tile.viewBox">
                  <image [attr.href]="grassSrc" width="192" height="192" />
                </svg>
              }
            </g>
            @for (tree of scene.trees; track $index) {
              <image [attr.href]="tree.src" [attr.x]="tree.x" [attr.y]="tree.y" [attr.width]="tree.width" [attr.height]="tree.height" />
            }
            @for (item of p.items ?? []; track $index) {
              <image [attr.href]="itemSrc[item.kind]" [attr.x]="item.x - itemSize / 2" [attr.y]="item.y - itemSize / 2" [attr.width]="itemSize" [attr.height]="itemSize" />
            }
            @for (o of p.obstacles ?? []; track $index) {
              <image [attr.href]="stoneFor(o)" [attr.x]="o.x + 0.1" [attr.y]="o.y + 0.1" width="0.8" height="0.8" />
            }
            <!-- an enemy may fill its whole square: the path is at least a square away from every side -->
            @for (e of p.enemies ?? []; track $index) {
              <image [attr.href]="enemyFor(e)" [attr.x]="e.x" [attr.y]="e.y" width="1" height="1" />
            }
            <!-- dots on top of the pictures: a coin or meat lies on a dot the path goes through, not at its end -->
            @for (x of dotIndexes(p); track x) {
              @for (y of dotIndexes(p); track y) {
                <circle class="gp" [attr.cx]="x" [attr.cy]="y" r="0.1" />
              }
            }
            <circle class="dot" [attr.cx]="p.start.x" [attr.cy]="p.start.y" r="0.2" />
            <circle class="dot" [attr.cx]="p.end.x" [attr.cy]="p.end.y" r="0.2" />
            <image [attr.href]="heroSrc" [attr.x]="scene.hero.x" [attr.y]="scene.hero.y" [attr.width]="scene.hero.width" [attr.height]="scene.hero.height" />
            <image [attr.href]="goalSrc" [attr.x]="scene.goal.x" [attr.y]="scene.goal.y" [attr.width]="scene.goal.width" [attr.height]="scene.goal.height" />
          </svg>
          @if (foundRows(p).length) {
            <!-- one box per item on the path: tick it when the path reaches the item -->
            <div class="found">
              @for (row of foundRows(p); track row.kind) {
                <span class="found-row">
                  <img [src]="itemSrc[row.kind]" alt="" />
                  @for (box of row.boxes; track box) {
                    <span class="box"></span>
                  }
                </span>
              }
            </div>
          }
        </div>
      </div>
    </app-page-sheet>
  }
</app-worksheet-layout>

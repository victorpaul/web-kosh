name: Deploy to Firebase Hosting

on:
  # every push to master goes live
  push:
    branches: [master]
  # pull requests get a temporary preview URL, posted as a comment on the PR
  pull_request:
  # manual run from the Actions tab (or `gh workflow run deploy.yml --ref <branch>`) for any branch
  workflow_dispatch:
    inputs:
      channel:
        description: 'live = the real site; preview = a temporary URL (7 days)'
        type: choice
        options: [live, preview]
        default: live

# one deploy per branch at a time; a newer push cancels the older run
concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  # service-account key JSON (role: Firebase Hosting Admin), stored as a repository secret
  FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npx ng build

      # Dependabot PRs get no secrets, so they are only built (a check that the update doesn't break the site)
      - name: Deploy preview
        if: (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') || inputs.channel == 'preview'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SA }}
          projectId: sukinsan
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'manual-preview' }}
          expires: 7d

      - name: Deploy live
        if: github.event_name != 'pull_request' && inputs.channel != 'preview'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SA }}
          projectId: sukinsan
          channelId: live
